# 在线安装专用：仅拉取 GHCR 预构建镜像，不在客户机 build。
# 由 install-online.sh 下载到安装目录后作为 docker-compose.yml 使用。

services:
  mysql:
    image: mysql:8.4
    container_name: datacore_mcp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_DOCKER_ROOT_PASSWORD:-${MYSQL_DOCKER_PASSWORD:-${MYSQL_PASSWORD}}}"
      MYSQL_DATABASE: "${MYSQL_DOCKER_DATABASE:-datacore_mcp}"
      MYSQL_USER: "${MYSQL_DOCKER_USER:-datacore_mcp}"
      MYSQL_PASSWORD: "${MYSQL_DOCKER_PASSWORD:-${MYSQL_PASSWORD}}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  datacore_mcp:
    image: ${DATACORE_IMAGE:-ghcr.io/jessdy/datacore_mcp:latest}
    container_name: datacore_mcp
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8765}:8765"
    env_file:
      - .env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8765"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "${MYSQL_DOCKER_USER:-datacore_mcp}"
      MYSQL_PASSWORD: "${MYSQL_DOCKER_PASSWORD:-${MYSQL_PASSWORD}}"
      MYSQL_DATABASE: "${MYSQL_DOCKER_DATABASE:-datacore_mcp}"
      LICENSE_DATA_DIR: "/data/license"
      LICENSE_SIGNING_PRIVATE_KEY: "${LICENSE_SIGNING_PRIVATE_KEY}"
      LICENSE_VERIFY_PUBLIC_KEY: "${LICENSE_VERIFY_PUBLIC_KEY}"
    volumes:
      - ./tools:/app/tools
      - license_data:/data/license
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin:
    image: ${DATACORE_ADMIN_IMAGE:-ghcr.io/jessdy/datacore_mcp-admin:latest}
    container_name: datacore_mcp_admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      datacore_mcp:
        condition: service_started
    command: ["python", "admin/app.py"]
    ports:
      - "${ADMIN_PORT:-8767}:8767"
    env_file:
      - .env
    environment:
      ADMIN_PORT: "8767"
      MCP_RESTART_MODE: "docker"
      MCP_DOCKER_CONTAINER: "datacore_mcp"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "${MYSQL_DOCKER_USER:-datacore_mcp}"
      MYSQL_PASSWORD: "${MYSQL_DOCKER_PASSWORD:-${MYSQL_PASSWORD}}"
      MYSQL_DATABASE: "${MYSQL_DOCKER_DATABASE:-datacore_mcp}"
      LICENSE_DATA_DIR: "/data/license"
      LICENSE_SIGNING_PRIVATE_KEY: "${LICENSE_SIGNING_PRIVATE_KEY}"
      LICENSE_VERIFY_PUBLIC_KEY: "${LICENSE_VERIFY_PUBLIC_KEY}"
    volumes:
      - ./tools:/app/tools
      - license_data:/data/license
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:
  license_data:
